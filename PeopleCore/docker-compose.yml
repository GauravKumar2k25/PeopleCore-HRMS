services:
  sqlserver:
    image: mcr.microsoft.com/mssql/server:2022-latest
    environment:
      ACCEPT_EULA: "Y"
      MSSQL_SA_PASSWORD: "ChangeThis_StrongPassword123!"
    ports: ["1433:1433"]
    volumes: ["peoplecore_sql:/var/opt/mssql"]
  api:
    build: ./backend/PeopleCore.Api
    environment:
      ASPNETCORE_ENVIRONMENT: Development
      ConnectionStrings__DefaultConnection: "Server=sqlserver,1433;Database=PeopleCoreDb;User Id=sa;Password=ChangeThis_StrongPassword123!;TrustServerCertificate=True;Encrypt=False"
      Jwt__Key: "REPLACE_THIS_WITH_A_LONG_RANDOM_SECRET_KEY_32_CHARS_MINIMUM"
    ports: ["8080:8080"]
    depends_on: [sqlserver]
volumes:
  peoplecore_sql:
